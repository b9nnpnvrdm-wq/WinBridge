name: macOS preview and download page

on:
  push:
    branches: [main]
    paths:
      - 'macOS/**'
      - 'tests/windows-fixtures/**'
      - 'pages/**'
      - 'scripts/**'
      - 'docs/bundled-wine.md'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

concurrency:
  group: winbridge-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wine:
    name: Provision Wine 11.0 for x86-64 macOS
    runs-on: macos-15-intel
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@v5
        id: wine-cache
        with:
          path: |
            dist/WinBridge-Wine-runtime.tar.gz
            dist/wine-11.0-source.tar.gz
            dist/freetype-2.15.0.tar.xz
          key: winbridge-wine-macos15-x64-${{ hashFiles('scripts/build-wine-macos.sh', 'scripts/audit-wine-runtime.py', 'scripts/patches/**', 'docs/bundled-wine.md') }}
      - name: Build Wine if the matching runtime is not cached
        if: steps.wine-cache.outputs.cache-hit != 'true'
        run: |
          brew list --versions bison || brew install bison
          ./scripts/build-wine-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: winbridge-wine
          path: |
            dist/WinBridge-Wine-runtime.tar.gz
            dist/wine-11.0-source.tar.gz
            dist/freetype-2.15.0.tar.xz
          if-no-files-found: error
          compression-level: 0

  fixtures:
    name: Build Windows EXE, DLL and installer fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lld wixl
      - run: ./scripts/build-windows-fixtures.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-fixtures
          path: dist/windows-fixtures/
          if-no-files-found: error

  swift-tests:
    name: Test the Apple Silicon launcher and updater build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: xcodebuild -version
      - run: xcrun swift test --package-path macOS --arch arm64

  build:
    name: Build and test Apple Silicon app
    runs-on: macos-15
    needs: [wine, swift-tests, fixtures]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: winbridge-wine
          path: dist
      - run: ./scripts/package-macos.sh
        env:
          WINBRIDGE_UPDATE_FEED_URL: ${{ vars.WINBRIDGE_UPDATE_FEED_URL }}
          WINBRIDGE_UPDATE_PUBLIC_KEY: ${{ vars.WINBRIDGE_UPDATE_PUBLIC_KEY }}
      - name: Smoke test bundled Wine under Rosetta
        run: ./scripts/smoke-test-wine-macos.sh dist/WinBridge.app
      - uses: actions/download-artifact@v8
        with:
          name: windows-fixtures
          path: dist/windows-fixtures
      - name: Test Windows application launch and MSI lifecycle
        run: |
          export WINBRIDGE_TEST_WINE="$PWD/dist/WinBridge.app/Contents/SharedSupport/Wine/bin/wine"
          export WINBRIDGE_TEST_FIXTURES="$PWD/dist/windows-fixtures"
          xcrun swift test --package-path macOS --arch arm64 --filter WindowsApplicationTests.testRealWindowsRuntimeFixtures
      - name: Verify Finder Open With reaches the app library
        run: ./scripts/smoke-test-finder-open.sh "$PWD/dist/WinBridge.app" "$PWD/dist/windows-fixtures/app/fixture.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: winbridge-macos
          path: |
            dist/WinBridge-arm64.zip
            dist/WinBridge-arm64.zip.sha256
            dist/wine-11.0-source.tar.gz
            dist/freetype-2.15.0.tar.xz
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish preview ZIP
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: winbridge-macos
          path: dist
      - name: Create prerelease for this build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check WinBridge-arm64.zip.sha256
          tag="preview-${GITHUB_SHA:0:12}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This revision already has a preview release."
            exit 0
          fi
          gh release create "$tag" WinBridge-arm64.zip WinBridge-arm64.zip.sha256 wine-11.0-source.tar.gz freetype-2.15.0.tar.xz \
            --target "$GITHUB_SHA" --prerelease --title "WinBridge macOS preview (${GITHUB_SHA:0:12})" \
            --notes "Apple Silicon, macOS 14 or later. Ad hoc signed for testing. No Developer ID or notarization. Includes first-run Wine setup, Finder and drag-and-drop app imports, and the Wine 11.0 runtime with FreeType and corresponding source. Requires Rosetta. GTA V gameplay remains unverified."
        working-directory: dist

  pages:
    name: Deploy GitHub Pages download
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - uses: actions/download-artifact@v8
        with:
          name: winbridge-macos
          path: pages
      - name: Verify the download files
        working-directory: pages
        run: sha256sum --check WinBridge-arm64.zip.sha256
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - uses: actions/deploy-pages@v4
        id: deployment
