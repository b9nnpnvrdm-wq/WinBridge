name: Diagnose Windows Steam bootstrap on macOS

on:
  push:
    branches: [main]
    paths: ['.github/workflows/steam-diagnostics.yml']
  workflow_dispatch:
    inputs:
      preview:
        description: WinBridge preview tag (leave empty to test the newest preview)
        required: false
  workflow_run:
    workflows: [macOS preview and download page]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  steam-bootstrap:
    name: Run Steam without signing in
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the tested WinBridge build
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: winbridge-macos
          path: ${{ runner.temp }}/steam-smoke
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download WinBridge and the Windows Steam installer
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
        run: |
          directory="$RUNNER_TEMP/steam-smoke"
          mkdir -p "$directory"
          cd "$directory"
          if [[ "$GITHUB_EVENT_NAME" != workflow_run ]]; then
            if [[ -z "$PREVIEW" ]]; then
              PREVIEW=$(gh release list --limit 20 --json tagName,isDraft,isPrerelease \
                --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | test("^preview-[a-f0-9]{12}$")))] | .[0].tagName // empty')
            fi
            [[ "$PREVIEW" =~ ^preview-[a-f0-9]{12}$ ]]
            echo "Testing WinBridge $PREVIEW."
            gh release download "$PREVIEW" --pattern 'WinBridge-arm64.zip*'
          fi
          shasum -a 256 -c WinBridge-arm64.zip.sha256
          ditto -x -k WinBridge-arm64.zip .
          curl --fail --location --retry 2 --silent --show-error \
            https://cdn.fastly.steamstatic.com/client/installer/SteamSetup.exe -o SteamSetup.exe
      - name: Install Steam and inspect startup
        timeout-minutes: 8
        run: |
          directory="$RUNNER_TEMP/steam-smoke"
          cd "$directory"
          runtime="$directory/WinBridge.app/Contents/SharedSupport/Wine/bin"
          export WINEPREFIX="$directory/prefix"
          export WINEDEBUG="-all,err+module,err+secur32,err+schannel,err+winediag"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          cleanup() {
            "$runtime/wineserver" -k || true
            "$runtime/wineserver" -w || true
          }
          trap cleanup EXIT

          "$runtime/wine" "$directory/SteamSetup.exe" /S >installer.log 2>&1 &
          installer=$!
          client=""
          for attempt in {1..36}; do
            if [[ -d "$WINEPREFIX/drive_c" ]]; then
              client=$(find "$WINEPREFIX/drive_c" -iname Steam.exe -type f -print -quit)
              [[ -z "$client" ]] || break
            fi
            if ! kill -0 "$installer" 2>/dev/null; then
              status=0
              wait "$installer" || status=$?
              echo "SteamSetup Wine exit status: $status"
              break
            fi
            sleep 4
          done
          echo "::group::Steam installer log"
          tail -80 installer.log
          echo "::endgroup::"
          if [[ -z "$client" ]]; then
            ps -Ao pid,comm | grep -Ei 'wine|steam' || true
            echo "::error::Steam.exe was not installed within the probe window"
            exit 1
          fi
          sleep 5
          echo 'Found installed Steam.exe.'
          # The installer can start a client itself. Close only this disposable
          # environment so the compatibility flags are used on the next launch.
          "$runtime/wineserver" -k || true
          "$runtime/wineserver" -w
          WINEDEBUG="$WINEDEBUG,+seh,+loaddll" \
            "$runtime/wine" "$client" -cef-disable-gpu -cef-disable-gpu-compositing >steam.log 2>&1 &
          # A fresh install can apply both the bootstrap and the 64-bit client
          # update before it starts the process that draws the sign-in window.
          helper_started=false
          for attempt in {1..54}; do
            if pgrep -fi 'steamwebhelper\.exe' >/dev/null; then
              helper_started=true
              sleep 12
              break
            fi
            sleep 4
          done
          tail -65 steam.log
          logs="$(dirname "$client")/logs"
          for name in bootstrap_log.txt cef_log.txt webhelper.txt; do
            if [[ -f "$logs/$name" ]]; then
              echo "::group::$name"
              tail -35 "$logs/$name"
              echo "::endgroup::"
            fi
          done

          if grep -Eqi 'unable to find a valid console font|unhandled division by zero' steam.log; then
            echo "::error::Wine hit the font or debugger crash during Steam startup"
            exit 1
          fi
          if [[ "$helper_started" != true ]]; then
            fault=$(grep -m1 -E 'Unhandled page fault|Unhandled exception' steam.log || true)
            if [[ -n "$fault" ]]; then
              echo "::group::Steam process fault"
              printf '%s\n' "$fault"
              thread=$(sed -nE 's/.*\(thread ([[:xdigit:]]+)\).*/\1/p' <<< "$fault")
              if [[ -n "$thread" ]]; then
                grep -iE "(^|:)$thread:.*(trace:seh:|trace:loaddll:|err:)" steam.log | tail -60 || true
              fi
              echo 'Recent loaded modules:'
              grep 'trace:loaddll:' steam.log | tail -65 || true
              echo '::endgroup::'
            fi
            echo "::error::Steam did not reach its web helper during the probe window"
            exit 1
          fi
          echo 'Steam started its web helper.'
          if pids=$(pgrep -fi 'steam\.exe|steamwebhelper\.exe'); then
            echo 'A Steam process remains active.'
            # Probe the test account's Steam windows without signing in.
            printf '%s\n' "$pids" | xcrun swift -e '
              import AppKit
              import CoreGraphics
              import Foundation

              var pids: Set<Int32> = []
              while let line = readLine() {
                  if let pid = Int32(line) { pids.insert(pid) }
              }
              let windows = CGWindowListCopyWindowInfo(
                  [.optionOnScreenOnly, .excludeDesktopElements], kCGNullWindowID
              ) as? [[String: Any]] ?? []
              let candidates = windows.compactMap { window -> (Int, CGFloat)? in
                  guard let pid = window[kCGWindowOwnerPID as String] as? Int32, pids.contains(pid),
                        let layer = window[kCGWindowLayer as String] as? Int, layer == 0,
                        let id = window[kCGWindowNumber as String] as? Int,
                        let bounds = window[kCGWindowBounds as String] as? NSDictionary,
                        let rect = CGRect(dictionaryRepresentation: bounds as CFDictionary),
                        rect.width >= 180, rect.height >= 120 else { return nil }
                  return (id, rect.width * rect.height)
              }
              guard let window = candidates.max(by: { $0.1 < $1.1 }) else {
                  print("No on-screen Steam window detected on this runner.")
                  exit(0)
              }
              print("On-screen Steam window detected.")
              let url = FileManager.default.temporaryDirectory
                  .appendingPathComponent(UUID().uuidString).appendingPathExtension("png")
              defer { try? FileManager.default.removeItem(at: url) }
              let capture = Process()
              capture.executableURL = URL(fileURLWithPath: "/usr/sbin/screencapture")
              capture.arguments = ["-x", "-o", "-l", String(window.0), url.path]
              try capture.run()
              capture.waitUntilExit()
              guard capture.terminationStatus == 0, let bytes = try? Data(contentsOf: url),
                    let image = NSBitmapImageRep(data: bytes) else {
                  print("Steam window pixels could not be read on this runner.")
                  exit(0)
              }
              var sampled = 0
              var nearBlack = 0
              for y in stride(from: image.pixelsHigh / 5, to: image.pixelsHigh * 4 / 5, by: 12) {
                  for x in stride(from: image.pixelsWide / 10, to: image.pixelsWide * 9 / 10, by: 12) {
                      guard let color = image.colorAt(x: x, y: y)?.usingColorSpace(.deviceRGB) else { continue }
                      sampled += 1
                      if max(color.redComponent, color.greenComponent, color.blueComponent) < 0.035 {
                          nearBlack += 1
                      }
                  }
              }
              if sampled > 0 {
                  print("Steam window near-black interior samples: \(nearBlack)/\(sampled)")
              }
            ' || echo 'The optional Steam window probe was unavailable.'
          else
            echo "::error::Steam processes exited after bootstrap"
            exit 1
          fi
