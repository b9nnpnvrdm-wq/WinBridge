name: Diagnose Windows Steam bootstrap on macOS

on:
  workflow_dispatch:
    inputs:
      preview:
        description: WinBridge preview release tag to test
        required: true
        default: preview-15a21786b335
  workflow_run:
    workflows: [macOS preview and download page]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  steam-bootstrap:
    name: Run Steam without signing in
    runs-on: macos-15
    timeout-minutes: 9
    defaults:
      run:
        shell: bash
    steps:
      - name: Download WinBridge and the Windows Steam installer
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PREVIEW: ${{ inputs.preview }}
          PREVIEW_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          directory="$RUNNER_TEMP/steam-smoke"
          mkdir "$directory"
          cd "$directory"
          if [[ -n "$PREVIEW_COMMIT" ]]; then
            PREVIEW="preview-${PREVIEW_COMMIT:0:12}"
          fi
          [[ "$PREVIEW" =~ ^preview-[a-f0-9]{12}$ ]]
          gh release download "$PREVIEW" --pattern 'WinBridge-arm64.zip*'
          shasum -a 256 -c WinBridge-arm64.zip.sha256
          ditto -x -k WinBridge-arm64.zip .
          curl --fail --location --retry 2 --silent --show-error \
            https://cdn.fastly.steamstatic.com/client/installer/SteamSetup.exe -o SteamSetup.exe
      - name: Install Steam and inspect startup
        timeout-minutes: 6
        run: |
          directory="$RUNNER_TEMP/steam-smoke"
          cd "$directory"
          runtime="$directory/WinBridge.app/Contents/SharedSupport/Wine/bin"
          export WINEPREFIX="$directory/prefix"
          export WINEDEBUG="-all,err+module,err+secur32,err+schannel,err+winediag"
          export WINEDLLOVERRIDES="mscoree,mshtml="
          cleanup() {
            "$runtime/wineserver" -k || true
            "$runtime/wineserver" -w || true
          }
          trap cleanup EXIT

          "$runtime/wine" "$directory/SteamSetup.exe" /S >installer.log 2>&1 &
          installer=$!
          client=""
          for attempt in {1..36}; do
            if [[ -d "$WINEPREFIX/drive_c" ]]; then
              client=$(find "$WINEPREFIX/drive_c" -iname Steam.exe -type f -print -quit)
              [[ -z "$client" ]] || break
            fi
            if ! kill -0 "$installer" 2>/dev/null; then
              status=0
              wait "$installer" || status=$?
              echo "SteamSetup Wine exit status: $status"
              break
            fi
            sleep 4
          done
          echo "::group::Steam installer log"
          tail -80 installer.log
          echo "::endgroup::"
          if [[ -z "$client" ]]; then
            ps -Ao pid,comm | grep -Ei 'wine|steam' || true
            echo "::error::Steam.exe was not installed within the probe window"
            exit 1
          fi
          sleep 5
          echo 'Found installed Steam.exe.'
          "$runtime/wine" "$client" -cef-disable-gpu >steam.log 2>&1 &
          sleep 120
          tail -65 steam.log
          logs="$(dirname "$client")/logs"
          for name in bootstrap_log.txt cef_log.txt webhelper.txt; do
            if [[ -f "$logs/$name" ]]; then
              echo "::group::$name"
              tail -35 "$logs/$name"
              echo "::endgroup::"
            fi
          done

          if grep -Eqi 'unable to find a valid console font|unhandled division by zero' steam.log; then
            echo "::error::Wine hit the font or debugger crash during Steam startup"
            exit 1
          fi
          if pgrep -fi 'steam\.exe|steamwebhelper\.exe'; then
            echo 'A Steam process remains active. The sign-in window was not checked.'
          else
            echo "::error::Steam processes exited after bootstrap"
            exit 1
          fi
